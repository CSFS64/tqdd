<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>后台管理</title>
<meta name="color-scheme" content="dark light" />
<style>
  :root{
    --bg:#0f0f0f;--card:#151515;--line:#2b2b2b;--fg:#f5f5f5;--muted:#a9a9a9;
    --accent:#ffdd57;--primary:#2b68ff;--primary-hover:#1f55d8;--danger:#ff6464;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,"PingFang SC","Microsoft Yahei",sans-serif;}
  .container{max-width:1080px;margin:0 auto;padding:1rem;}
  h1{font-size:1.5rem;margin:.25rem 0 1rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem;margin-top:1rem}
  .row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
  input[type="password"],input[type="text"],input[type="datetime-local"],textarea{
    background:#111;color:var(--fg);border:1px solid #3a3a3a;border-radius:8px;padding:.55rem .7rem
  }
  textarea{width:100%;min-height:90px;resize:vertical}
  .btn{appearance:none;border:0;border-radius:10px;padding:.6rem .9rem;cursor:pointer;background:var(--primary);color:#fff;font-weight:700}
  .btn:hover{background:var(--primary-hover)}
  .btn--danger{background:var(--danger)}
  .btn--ghost{background:#1b1b1b;border:1px solid #2c2c2c}
  .tabs{display:flex;gap:.5rem;margin-top:1rem;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:#121212;color:#ddd;border-radius:999px;padding:.4rem .85rem;cursor:pointer}
  .tab[aria-selected="true"]{background:#1e1e1e;color:var(--accent);border-color:#444}
  .table{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#111;margin-top:.75rem}
  .table th,.table td{padding:.6rem .75rem;border-top:1px solid var(--line);text-align:left;vertical-align:top}
  .table thead th{background:#1b1b1b;color:var(--accent);border-top:none}
  .muted{color:var(--muted);font-size:.9rem}
  .toolbar{display:flex;gap:.5rem;align-items:center;justify-content:space-between;margin-top:.5rem;flex-wrap:wrap}
  .left{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
  .nowrap{white-space:nowrap}
  .badge{display:inline-block;padding:.15rem .45rem;border:1px solid #444;border-radius:999px;color:#ddd;font-size:.8rem}
  .wrap{word-break:break-word}
  .grid{display:grid;gap:.75rem}
  @media (min-width: 720px){
    .grid-2{grid-template-columns:1fr 1fr}
  }
  .right{ text-align:right }
  dialog{border:none;border-radius:12px;padding:0;max-width:680px;width:92%;}
  dialog .dlg__body{padding:1rem 1rem 1.2rem;background:#151515;color:#f5f5f5;border:1px solid #2b2b2b;border-radius:12px}
  dialog .dlg__title{margin:.25rem 0 1rem;font-size:1.1rem}
  .chips{display:flex;flex-wrap:wrap;gap:.35rem}
  .chip{border:1px solid #3a3a3a;border-radius:999px;padding:.15rem .55rem;color:#ddd;font-size:.85rem}
</style>
</head>
<body>
  <div class="container">
    <h1>后台管理</h1>

    <!-- 认证区 -->
    <div class="card">
      <div class="row">
        <label class="nowrap" for="token">管理口令：</label>
        <input id="token" type="password" placeholder="输入 ADMIN_TOKEN，例如 804" />
        <button class="btn" id="saveToken">保存口令</button>
        <span class="muted">也可在地址栏加 <code>?token=xxx</code> 自动填充</span>
      </div>
    </div>

    <!-- 页签 -->
    <div class="tabs" role="tablist" aria-label="数据类别">
      <button class="tab" role="tab" id="tab-roommate" aria-selected="true" aria-controls="panel-roommate">同居匹配</button>
      <button class="tab" role="tab" id="tab-recruit"  aria-selected="false" aria-controls="panel-recruit">招募申请</button>
      <button class="tab" role="tab" id="tab-agenda"   aria-selected="false" aria-controls="panel-agenda">议程管理</button>
    </div>

    <!-- 同居匹配 面板 -->
    <section id="panel-roommate" class="card" role="tabpanel" aria-labelledby="tab-roommate">
      <div class="toolbar">
        <div class="left">
          <button class="btn" id="reloadRoommate">刷新</button>
          <button class="btn btn--danger" id="deleteSelected">删除所选</button>
          <span class="muted" id="rmCount"></span>
        </div>
        <div class="muted">表：submissions/…</div>
      </div>

      <table class="table" id="roommateTable">
        <thead>
          <tr>
            <th style="width:36px;"><input type="checkbox" id="checkAllRm"></th>
            <th>昵称 / 联系</th>
            <th>时段</th>
            <th>玩法</th>
            <th>语音/性别</th>
            <th style="width:40%;">自我介绍</th>
          </tr>
        </thead>
        <tbody id="roommateTbody">
          <tr><td colspan="6" class="muted">未加载</td></tr>
        </tbody>
      </table>
    </section>

    <!-- 招募申请 面板 -->
    <section id="panel-recruit" class="card" role="tabpanel" aria-labelledby="tab-recruit" hidden>
      <div class="toolbar">
        <div class="left">
          <button class="btn" id="reloadRecruit">刷新</button>
          <button class="btn btn--danger" id="deleteSelectedRe">删除所选</button>
          <span class="muted" id="reCount"></span>
        </div>
        <div class="muted">表：recruits/…</div>
      </div>
    
      <table class="table" id="recruitTable">
        <thead>
          <tr>
            <th style="width:36px;"><input type="checkbox" id="checkAllRe"></th>
            <th>昵称 / 联系</th>
            <th>生存等级</th>
            <th>在线日</th>
            <th>每日在线时长</th>
            <th>建筑分</th>
            <th style="width:40%;">备注</th>
          </tr>
        </thead>
        <tbody id="recruitTbody">
          <tr><td colspan="7" class="muted">未加载</td></tr>
        </tbody>
      </table>
    </section>

    <!-- 议程管理 面板 -->
    <section id="panel-agenda" class="card" role="tabpanel" aria-labelledby="tab-agenda" hidden>
      <div class="toolbar">
        <div class="left">
          <button class="btn" id="reloadAgenda">刷新</button>
          <button class="btn btn--danger" id="deleteSelectedAg">删除所选</button>
          <span class="muted" id="agCount"></span>
        </div>
        <div class="muted">表：agendas/…、agendas_votes/…</div>
      </div>

      <!-- 创建议程 -->
      <div class="card" style="margin-top:.75rem">
        <h3 style="margin:.25rem 0 .5rem">创建议程</h3>
        <div class="grid grid-2">
          <label>标题<br><input id="agTitle" type="text" placeholder="例如：是否将巡逻时间统一至 20:00？"></label>
          <label>提交人<br><input id="agAuthor" type="text" placeholder="例如：管理员"></label>
          <label>截止时间<br><input id="agDeadline" type="datetime-local"></label>
          <label>标签（逗号分隔）<br><input id="agTags" type="text" placeholder="巡逻,制度"></label>
        </div>
        <div class="grid" style="margin-top:.5rem">
          <label>简介<br><textarea id="agDesc" placeholder="简要说明本议程要解决的问题…"></textarea></label>
        </div>
        <div class="grid grid-2" style="margin-top:.5rem">
          <label>
            类型<br>
            <select id="agType">
              <option value="vote">投票</option>
              <option value="qa">问答</option>
            </select>
          </label>
          <label id="agOptionsWrap">
            投票选项（用中文逗号或英文逗号分隔）<br>
            <input id="agOptions" type="text" placeholder="同意, 不同意, 需要改动后再投票">
          </label>
        </div>
        <div class="right" style="margin-top:.5rem">
          <button class="btn" id="createAgenda">创建议程</button>
        </div>
      </div>

      <!-- 议程列表 -->
      <table class="table" id="agendaTable">
        <thead>
          <tr>
            <th style="width:36px;"><input type="checkbox" id="checkAllAg"></th>
            <th>标题 / 标签</th>
            <th>提交人 / 截止</th>
            <th>类型</th>
            <th style="width:140px;">操作</th>
          </tr>
        </thead>
        <tbody id="agendaTbody">
          <tr><td colspan="5" class="muted">未加载</td></tr>
        </tbody>
      </table>
    </section>
  </div>

  <!-- 结果弹窗 -->
  <dialog id="dlgResults">
    <div class="dlg__body">
      <div class="row" style="justify-content:space-between;align-items:center">
        <div class="dlg__title">议程结果</div>
        <button class="btn btn--ghost" onclick="document.getElementById('dlgResults').close()">关闭</button>
      </div>
      <div id="resultsBody" class="grid"></div>
    </div>
  </dialog>

<script>
  // ========== 基础 ==========
  const API_BASE = '/api';
  const qs = new URLSearchParams(location.search);
  const $ = sel => document.querySelector(sel);
  const $$ = sel => Array.from(document.querySelectorAll(sel));

  // token
  const tokenInput = $('#token');
  const saved = localStorage.getItem('ADMIN_TOKEN') || qs.get('token') || '';
  if (saved) tokenInput.value = saved;
  $('#saveToken').addEventListener('click', ()=>{
    localStorage.setItem('ADMIN_TOKEN', tokenInput.value.trim());
    alert('口令已保存到本地浏览器');
  });
  const authHeaders = () => {
    const t = (tokenInput.value || '').trim();
    return t ? { 'X-Admin-Token': t } : {};
  };
  const humanTime = (ts)=>{
    try{ const d=new Date(ts); return isNaN(d)?'':d.toLocaleString(); }catch{ return '';}
  };
  const esc = s => String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');

  // ========== 页签 ==========
  const tabRoom = $('#tab-roommate');
  const tabRecr = $('#tab-recruit');
  const tabAg   = $('#tab-agenda');
  const panelRoom = $('#panel-roommate');
  const panelRecr = $('#panel-recruit');
  const panelAg   = $('#panel-agenda');

  function selectTab(which){
    const map = {room:[true,false,false], recruit:[false,true,false], agenda:[false,false,true]};
    const [r1,r2,r3] = map[which] || [true,false,false];
    tabRoom.setAttribute('aria-selected', r1?'true':'false');
    tabRecr.setAttribute('aria-selected', r2?'true':'false');
    tabAg.setAttribute('aria-selected',   r3?'true':'false');
    panelRoom.hidden = !r1; panelRecr.hidden = !r2; panelAg.hidden = !r3;
  }
  tabRoom.addEventListener('click', ()=>selectTab('room'));
  tabRecr.addEventListener('click', ()=>selectTab('recruit'));
  tabAg  .addEventListener('click', ()=>selectTab('agenda'));

  // ========== 同居匹配 ==========
  async function loadRoommate(){
    const tbody = $('#roommateTbody');
    const count = $('#rmCount');
    tbody.innerHTML = `<tr><td colspan="6" class="muted">加载中…</td></tr>`;
    count.textContent = '';
    try{
      const res = await fetch(`${API_BASE}/admin/list`, { headers: { 'Accept':'application/json', ...authHeaders() } });
      if (res.status === 401) { tbody.innerHTML = `<tr><td colspan="6" class="muted">未授权，请先填写口令</td></tr>`; return; }
      const json = await res.json();
      if (!json.ok) { tbody.innerHTML = `<tr><td colspan="6" class="muted">加载失败</td></tr>`; return; }
      const items = json.items || [];
      count.textContent = `共 ${items.length} 条`;
      if (!items.length){ tbody.innerHTML = `<tr><td colspan="6" class="muted">暂无数据</td></tr>`; return; }
      const toList = arr => Array.isArray(arr) ? arr.join(', ') : '';
      tbody.innerHTML = items.map(it=>`
        <tr data-id="${esc(it.id)}">
          <td><input type="checkbox" class="ck"></td>
          <td class="wrap"><div><strong>${esc(it.nickname)}</strong></div><div class="muted">${esc(it.contact)}</div><div class="muted">${humanTime(it.ts)}</div></td>
          <td class="wrap">${esc(toList(it.slots))}</td>
          <td class="wrap">${esc(toList(it.modes))}</td>
          <td class="wrap">${it.voice ? '<span class="badge">语音</span>' : ''} ${esc(it.gender||'')}</td>
          <td class="wrap">${esc(it.note)}</td>
        </tr>`).join('');
      const ckAll = $('#checkAllRm'); ckAll.checked = false;
      ckAll.onchange = ()=> $$('#roommateTbody .ck').forEach(ck=>ck.checked = ckAll.checked);
    }catch{ tbody.innerHTML = `<tr><td colspan="6" class="muted">网络错误</td></tr>`; }
  }
  async function deleteSelected(){
    const rows = $$('#roommateTbody tr');
    const toDel = rows.filter(r => r.querySelector('.ck')?.checked).map(r => r.getAttribute('data-id'));
    if (!toDel.length) return alert('请先勾选要删除的记录');
    if (!confirm(`确认删除 ${toDel.length} 条记录？`)) return;
    try{
      for (const id of toDel){
        await fetch(`${API_BASE}/admin/delete?id=${encodeURIComponent(id)}`, { method:'DELETE', headers:{ ...authHeaders() } });
      }
      await loadRoommate(); alert('删除完成');
    }catch{ alert('删除失败或网络错误'); }
  }
  $('#reloadRoommate').addEventListener('click', loadRoommate);
  $('#deleteSelected').addEventListener('click', deleteSelected);

  // ========== 招募 ==========
  async function loadRecruit(){
    const tbody = $('#recruitTbody');
    const count = $('#reCount');
    tbody.innerHTML = `<tr><td colspan="7" class="muted">加载中…</td></tr>`;
    count.textContent = '';
    try{
      const res = await fetch(`${API_BASE}/admin/recruit/list`, { headers: { 'Accept':'application/json', ...authHeaders() } });
      if (res.status === 401) { tbody.innerHTML = `<tr><td colspan="7" class="muted">未授权，请先填写口令</td></tr>`; return; }
      const json = await res.json();
      if (!json.ok) { tbody.innerHTML = `<tr><td colspan="7" class="muted">加载失败</td></tr>`; return; }
      const items = json.items || [];
      count.textContent = `共 ${items.length} 条`;
      if (!items.length){ tbody.innerHTML = `<tr><td colspan="7" class="muted">暂无数据</td></tr>`; return; }
      const toList = arr => Array.isArray(arr) ? arr.join(', ') : '';
      tbody.innerHTML = items.map(it=>`
        <tr data-id="${esc(it.id)}">
          <td><input type="checkbox" class="ck-re"></td>
          <td class="wrap">
            <div><strong>${esc(it.nickname)}</strong></div>
            <div class="muted">${esc(it.contact)}</div>
            <div class="muted">${humanTime(it.ts)}</div>
          </td>
          <td>${esc(it.survival)}</td>
          <td>${esc(toList(it.days))}</td>
          <td>${esc(it.hours)} 小时</td>
          <td>${esc(it.build)}</td>
          <td class="wrap">${esc(it.note)}</td>
        </tr>`).join('');
      const ckAll = $('#checkAllRe'); ckAll.checked = false;
      ckAll.onchange = ()=> $$('#recruitTbody .ck-re').forEach(ck => ck.checked = ckAll.checked);
    }catch{ tbody.innerHTML = `<tr><td colspan="7" class="muted">网络错误</td></tr>`; }
  }
  async function deleteSelectedRecruit(){
    const rows = $$('#recruitTbody tr');
    const toDel = rows.filter(r => r.querySelector('.ck-re')?.checked).map(r => r.getAttribute('data-id')).filter(Boolean);
    if (!toDel.length) return alert('请先勾选要删除的记录');
    if (!confirm(`确认删除 ${toDel.length} 条招募申请？`)) return;
    try{
      for (const id of toDel){
        await fetch(`${API_BASE}/admin/recruit/delete?id=${encodeURIComponent(id)}`, { method:'DELETE', headers:{ ...authHeaders() } });
      }
      await loadRecruit(); alert('删除完成');
    }catch{ alert('删除失败或网络错误'); }
  }
  $('#reloadRecruit').addEventListener('click', loadRecruit);
  $('#deleteSelectedRe').addEventListener('click', deleteSelectedRecruit);

  // ========== 议程：创建 / 列表 / 删除 / 结果 ==========
  const agTypeEl = $('#agType'), agOptionsWrap = $('#agOptionsWrap');
  agTypeEl.addEventListener('change', ()=>{
    agOptionsWrap.style.display = (agTypeEl.value === 'vote') ? '' : 'none';
  });
  agOptionsWrap.style.display = ''; // 初始投票

  async function loadAgenda(){
    const tbody = $('#agendaTbody');
    const count = $('#agCount');
    tbody.innerHTML = `<tr><td colspan="5" class="muted">加载中…</td></tr>`;
    count.textContent = '';
    try{
      const res = await fetch(`${API_BASE}/admin/agenda/list`, { headers: { 'Accept':'application/json', ...authHeaders() } });
      if (res.status === 401) { tbody.innerHTML = `<tr><td colspan="5" class="muted">未授权，请先填写口令</td></tr>`; return; }
      const json = await res.json();
      if (!json.ok) { tbody.innerHTML = `<tr><td colspan="5" class="muted">加载失败</td></tr>`; return; }
      const items = json.items || [];
      count.textContent = `共 ${items.length} 条`;
      if (!items.length){ tbody.innerHTML = `<tr><td colspan="5" class="muted">暂无数据</td></tr>`; return; }
      tbody.innerHTML = items.map(it=>{
        const tags = Array.isArray(it.tags) ? it.tags : (String(it.tags||'').split(/[,\s]+/).filter(Boolean));
        const tagHTML = tags.map(t=>`<span class="chip">${esc(t)}</span>`).join(' ');
        return `
          <tr data-id="${esc(it.id)}">
            <td><input type="checkbox" class="ck-ag"></td>
            <td class="wrap"><div><strong>${esc(it.title)}</strong></div><div class="chips" style="margin-top:.25rem">${tagHTML}</div></td>
            <td class="wrap"><div>${esc(it.author || '')}</div><div class="muted">${esc(it.deadline ? humanTime(it.deadline) : '')}</div></td>
            <td>${esc(it.type === 'qa' ? '问答' : '投票')}</td>
            <td>
              <button class="btn btn--ghost btn-small" data-op="results">查看结果</button>
            </td>
          </tr>`;
      }).join('');
      const ckAll = $('#checkAllAg'); ckAll.checked = false;
      ckAll.onchange = ()=> $$('#agendaTbody .ck-ag').forEach(ck => ck.checked = ckAll.checked);

      // 绑定查看结果
      $$('#agendaTbody [data-op="results"]').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          const id = btn.closest('tr').getAttribute('data-id');
          await showResults(id);
        });
      });
    }catch{ tbody.innerHTML = `<tr><td colspan="5" class="muted">网络错误</td></tr>`; }
  }

  async function createAgenda(){
    const title = $('#agTitle').value.trim();
    const author = $('#agAuthor').value.trim();
    const deadline = $('#agDeadline').value ? new Date($('#agDeadline').value).getTime() : null;
    const desc = $('#agDesc').value.trim();
    const tags = $('#agTags').value.split(/[，,\s]+/).map(s=>s.trim()).filter(Boolean);
    const type = $('#agType').value; // vote | qa
    const options = (type === 'vote')
      ? $('#agOptions').value.split(/[，,\s]+/).map(s=>s.trim()).filter(Boolean)
      : [];

    if (!title) return alert('请填写标题');
    const payload = { title, author, deadline, desc, tags, type, options };

    try{
      const res = await fetch(`${API_BASE}/admin/agenda/create`, {
        method:'POST',
        headers:{ 'Accept':'application/json', 'Content-Type':'application/json', ...authHeaders() },
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if (!json.ok) return alert('创建失败：' + (json.error || '未知错误'));
      // 清空表单
      $('#agTitle').value = ''; $('#agAuthor').value=''; $('#agDeadline').value='';
      $('#agDesc').value=''; $('#agTags').value=''; $('#agOptions').value='';
      await loadAgenda();
      alert('创建成功');
    }catch{ alert('网络错误，创建失败'); }
  }
  $('#createAgenda').addEventListener('click', createAgenda);

  async function deleteSelectedAgenda(){
    const rows = $$('#agendaTbody tr');
    const toDel = rows.filter(r => r.querySelector('.ck-ag')?.checked).map(r => r.getAttribute('data-id')).filter(Boolean);
    if (!toDel.length) return alert('请先勾选要删除的议程');
    if (!confirm(`确认删除 ${toDel.length} 条议程？`)) return;
    try{
      for (const id of toDel){
        await fetch(`${API_BASE}/admin/agenda/delete?id=${encodeURIComponent(id)}`, {
          method:'DELETE', headers:{ ...authHeaders() }
        });
      }
      await loadAgenda(); alert('删除完成');
    }catch{ alert('删除失败或网络错误'); }
  }
  $('#reloadAgenda').addEventListener('click', loadAgenda);
  $('#deleteSelectedAg').addEventListener('click', deleteSelectedAgenda);

  async function showResults(id){
    try{
      const res = await fetch(`${API_BASE}/admin/agenda/results?id=${encodeURIComponent(id)}`, {
        headers:{ 'Accept':'application/json', ...authHeaders() }
      });
      const json = await res.json();
      if (!json.ok) return alert('读取失败');
      const body = $('#resultsBody');
      body.innerHTML = '';
      body.insertAdjacentHTML('beforeend', `<div><strong>${esc(json.item?.title || '议程')}</strong></div>`);
      if (json.item?.type === 'vote'){
        const list = Array.isArray(json.results) ? json.results : [];
        // results: [{option:'同意', count: 12}, ...]
        body.insertAdjacentHTML('beforeend', `<div class="muted">类型：投票</div>`);
        const rows = list.map(r=>`<tr><td>${esc(r.option)}</td><td>${esc(r.count)}</td></tr>`).join('');
        body.insertAdjacentHTML('beforeend', `<table class="table"><thead><tr><th>选项</th><th>票数</th></tr></thead><tbody>${rows || `<tr><td colspan="2" class="muted">暂无数据</td></tr>`}</tbody></table>`);
      }else{
        body.insertAdjacentHTML('beforeend', `<div class="muted">类型：问答</div>`);
        const answers = Array.isArray(json.results) ? json.results : []; // [{text:'……', ts: 173..., user:'xxx'}]
        if (!answers.length){
          body.insertAdjacentHTML('beforeend', `<div class="muted">暂无回答</div>`);
        }else{
          const rows = answers.map(a=>`<tr><td class="wrap">${esc(a.text)}</td><td class="muted">${a.user?esc(a.user):''}<br>${a.ts?humanTime(a.ts):''}</td></tr>`).join('');
          body.insertAdjacentHTML('beforeend', `<table class="table"><thead><tr><th>回答内容</th><th style="width:220px">提交者/时间</th></tr></thead><tbody>${rows}</tbody></table>`);
        }
      }
      document.getElementById('dlgResults').showModal();
    }catch{
      alert('结果读取失败或网络错误');
    }
  }

  // 初始：默认同居匹配
  selectTab('room');
  loadRoommate();
</script>
</body>
</html>
